[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crystalline"
version = "0.0.1"
description = "A desktop GUI for building/editing CRYSTAL structures and visualising vibrational modes, built on CRYSTALClear."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "CRYSTAL devs" }]
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
]
dependencies = [
    "PySide6>=6.5",
    "pyvista>=0.43",
    "pyvistaqt>=0.11",
    "numpy>=1.23",
    "ase>=3.22",
    "pymatgen>=2022",
    "CRYSTALClear>=0.2",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-qt>=4"]

[project.gui-scripts]
crystalline = "crystalline.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"crystalline.resources" = ["*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
